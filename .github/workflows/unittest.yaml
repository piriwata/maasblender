name: Unit Test

on:
  pull_request:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      subdirs: ${{ steps.set-subdir.outputs.target-list }}
    steps:
      - uses: actions/checkout@v3
      - name: Get src subdirectories
        id: set-subdir
        run: |
          list=`find ./src -name pyproject.toml | sed -r "s/^.*src\/(.*)\/pyproject.toml/\1/g" | jq -R -s -c 'split("\n")[:-1]' | jq -c .`
          echo "target-list=$list" >> $GITHUB_OUTPUT
  unittest:
    runs-on: ubuntu-latest
    needs: set-matrix
    strategy:
      matrix:
        target: ${{ fromJson(needs.set-matrix.outputs.subdirs) }}
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        working-directory: ./src/${{ matrix.target }}
        run: uv sync --frozen

      - name: unittest
        working-directory: ./src/${{ matrix.target }}
        run: uv run --no-sync python -m unittest discover -s ./test -p 'test_*.py'
