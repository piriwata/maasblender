name: Lint and Format

on:
  pull_request:
    branches:
      - "main"
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv run ruff format . --check
      - run: uv run ruff check . --output-format=github
